name: Playwright assurance

on:
  pull_request:
    branches: [playwright]
  push:
    branches: [playwright, "feature/playwright-**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/requirements.txt -r requirements-ci.txt
      - run: python -m pip check
      - run: python -m compileall -q apps tests
      - run: bash -n BillCollector.sh
      - run: ruff check --select F821 apps tests
      - run: ruff check --select E4,E7,E9 tests apps/download_publication.py apps/profile_store.py apps/helpers/BillCollectorRecipeContract.py
      - run: bandit -q -r apps -ll
      - run: pip-audit -r apps/requirements.txt --disable-pip --no-deps --progress-spinner off
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          BILLCOLLECTOR_BROWSER_TESTS: "1"

  container-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build -f Dockerfile_pw -t billcollector-playwright-assurance .
      - name: Inspect image and exercise publication rename on one mount
        run: >-
          docker run --rm --network none
          --mount type=tmpfs,destination=/publication
          --mount type=bind,source="$GITHUB_WORKSPACE/tests/check_container_contract.py",target=/check.py,readonly
          --entrypoint python3 billcollector-playwright-assurance /check.py
