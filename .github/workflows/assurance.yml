name: Playwright assurance

on:
  pull_request:
    branches: [main, playwright-next]
  push:
    branches: [main, playwright-next]
    tags: ["v*", "playwright-v*"]
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated image from the default branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Unit and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/requirements.txt
            .github/requirements-security.txt
      - run: python -m pip install -r apps/requirements.txt -r .github/requirements-security.txt
      - run: python -m pip check
      - run: python -m compileall -q apps tests
      - run: bash -n BillCollector.sh
      - run: ruff check --select F821 apps tests
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - name: Smoke test Chromium without a portal or vault
        run: |
          python - <<'PYTHON'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              try:
                  page = browser.new_page()
                  page.set_content("<h1>Synthetic browser check</h1>")
                  assert page.locator("h1").inner_text() == "Synthetic browser check"
              finally:
                  browser.close()
          PYTHON

  python-security:
    name: Python security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r .github/requirements-security.txt
      - name: Audit all pinned runtime dependencies
        run: pip-audit -r apps/requirements.txt --disable-pip --no-deps --progress-spinner off
      - name: Record medium and high Bandit findings
        run: bandit -q -r apps -ll --exit-zero -f json -o bandit.json
      - name: Reject high-severity Bandit findings
        run: bandit -q -r apps -lll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bandit-report
          path: bandit.json
          if-no-files-found: ignore
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  image-scan:
    name: Image security
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      PUBLISH_REQUESTED: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: billcollector-playwright:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image without network access
        run: |
          test "$(docker run --rm --network none --entrypoint id billcollector-playwright:ci -u)" != "0"
          docker run --rm --network none --entrypoint python3 billcollector-playwright:ci -c \
            'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop()'
      - name: Record image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: billcollector-playwright:ci
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln
          version: v0.70.0
      - name: Upload image findings to GitHub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: container-image
      - name: Reject fixable high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: billcollector-playwright:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          version: v0.70.0
          skip-setup-trivy: true
      - name: Save the scanned image for publication
        if: env.PUBLISH_REQUESTED == 'true'
        run: docker save --output image.tar billcollector-playwright:ci
      - name: Transfer the exact scanned image to the publication job
        if: env.PUBLISH_REQUESTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-image
          path: image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish validated image
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch)
    needs: [validate, python-security, codeql, image-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      # Separate package while the Selenium image remains in production.
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/billcollector-playwright
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already integrated into the default branch
        run: git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-image
      - run: docker load --input image.tar
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha
      - name: Publish the exact image that passed all gates
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag billcollector-playwright:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
