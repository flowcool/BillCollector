# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      # Local addition: documentation-only PRs (only *.md files, docs/ or
      # openspec/, the pr-gate rule; doc/ assets still get a review) are not
      # reviewed. Fails open: without a PR number or file list, the review runs.
      - name: Skip documentation-only PRs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ inputs.name }}
        run: |
          review=true
          pr=$(printf '%s' "$RUN_NAME" | sed -nE 's/^Review (new commits on )?#([0-9]+).*/\2/p')
          if [ -n "$pr" ]; then
            files=$(gh pr diff "$pr" --repo "$GITHUB_REPOSITORY" --name-only || true)
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/|openspec/)|\.md$'; then
              review=false
            fi
          fi
          echo "review=$review" >> "$GITHUB_OUTPUT"
      - name: Checkout code
        if: steps.scope.outputs.review == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Run agent
        if: steps.scope.outputs.review == 'true'
        uses: pullfrog/pullfrog@ae4145b3d72b3f4aa045e2352dc6b2c7538daeeb # deployed on flowcool/ghostfolio-ibkr-sync
        with:
          prompt: ${{ inputs.prompt }}
