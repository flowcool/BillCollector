---
$schema: "http://json-schema.org/draft-07/schema#"
type: object
additionalProperties: true
required:
  - service
  - recipeVersion
  - recipeFormatVersion
  - requiredActions
properties:
  service:
    type: string
    pattern: "^[a-z0-9_]+$"
  recipeVersion:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  recipeFormatVersion:
    type: integer
    minimum: 1
  requiredActions:
    type: array
    uniqueItems: true
    items:
      type: string
