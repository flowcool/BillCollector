---
$schema: "http://json-schema.org/draft-07/schema#"
title: "Recipe Playwright YAML Schema"
type: object
required: [services]
properties:
  $schema:
    type: string
  formatVersion:
    type: integer
    const: 1
  capabilities:
    type: array
    uniqueItems: true
    items:
      enum: [browser, download]
  services:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - serviceName
        - steps
      properties:
        serviceName:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            $ref: "#/definitions/step"
definitions:
  step:
    type: object
    additionalProperties: false
    required:
      - step
    properties:
      step:
        type: integer
      description:
        type: string
      methods:
        type: array
        items:
          $ref: "#/definitions/method"
      steps:
        type: array
        items:
          $ref: "#/definitions/step"
  method:
    type: object
    additionalProperties: false
    required:
      - method
    properties:
      method:
        type: string
      arguments:
        type: array
        items:
          type: object
          additionalProperties:
            type: [ "string", "boolean", "number", "object", "null" ]
additionalProperties: false
